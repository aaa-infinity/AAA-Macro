name: Build AAA Macro APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: List Generated APKs
        run: |
          echo "Built APK files:"
          ls -la app/build/outputs/apk/debug/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Macro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Macro-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "AAA Macro v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## AAA Macro Production Release
            - Native No-Root Automation Engine (AccessibilityService)
            - MediaProjection Screen Capture + OpenCV 4.5.3 Template Matching
            - Google ML Kit On-Device Text Recognition
            - Stochastic Gaussian Anti-Detection Gestures & Bézier Curves
            - Draggable Overlay UI Controller
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
